# Meridian: meridian-server + PostgreSQL.
#   cp deploy/.env.example deploy/.env   # then fill in secrets
#   docker compose -f deploy/docker-compose.yml up -d --build
name: meridian

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: meridian
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: meridian
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - meridian-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meridian -d meridian"]
      interval: 5s
      timeout: 3s
      retries: 20

  server:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        VERSION: ${MERIDIAN_VERSION:-dev}
    image: meridian-server:${MERIDIAN_VERSION:-dev}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      MERIDIAN_ADDR: ":8080"
      MERIDIAN_BASE_PATH: ${MERIDIAN_BASE_PATH:-/meridian}
      MERIDIAN_DATABASE_URL: postgres://meridian:${POSTGRES_PASSWORD}@db:5432/meridian?sslmode=disable
      MERIDIAN_ADMIN_TOKEN: ${MERIDIAN_ADMIN_TOKEN:?set MERIDIAN_ADMIN_TOKEN in deploy/.env}
      MERIDIAN_COOKIE_SECURE: ${MERIDIAN_COOKIE_SECURE:-true}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "127.0.0.1:${MERIDIAN_PORT:-8090}:8080"

volumes:
  meridian-pg:

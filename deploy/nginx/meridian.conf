# Meridian -> docker meridian-server (127.0.0.1:8090)
# Include inside the server block of the site. The ^~ modifier keeps regex
# locations such as `~ .*\.(html|js|css)?$` from capturing /meridian/assets.
location = /meridian {
    return 301 https://$host/meridian/;
}
location ^~ /meridian/ {
    if ($scheme = http) {
        return 301 https://$host$request_uri;
    }
    # The prefix is not stripped: meridian-server serves /meridian itself.
    proxy_pass http://127.0.0.1:8090;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    # Server-sent events
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    gzip off;
}

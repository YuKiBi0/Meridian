name: ci

on:
  push:
    branches: [main, develop, 'feature/**']
    paths: ['server/**', 'console/**', 'Dockerfile', '.github/workflows/ci.yml']
  pull_request:
    paths: ['server/**', 'console/**', 'Dockerfile', '.github/workflows/ci.yml']

jobs:
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: meridian
          POSTGRES_PASSWORD: meridian
          POSTGRES_DB: meridian
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U meridian" --health-interval 5s
          --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
      - run: go vet ./...
      - run: go test -p 1 ./...
        env:
          MERIDIAN_TEST_DATABASE_URL: postgres://meridian:meridian@127.0.0.1:5432/meridian?sslmode=disable

  console:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: console/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  image:
    runs-on: ubuntu-latest
    needs: [server, console]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t meridian-server:ci .

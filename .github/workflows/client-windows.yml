name: client-windows

on:
  push:
    branches: [main, develop, 'feature/client**']
    paths: ['client/**', '.github/workflows/client-windows.yml']
    tags: ['v*']
  pull_request:
    paths: ['client/**', '.github/workflows/client-windows.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test test/core_test.dart test/geometry_test.dart test/colors_test.dart
      - name: Window integration test
        run: flutter test integration_test/window_test.dart -d windows
      - run: flutter build windows --release

      - name: Package
        shell: pwsh
        run: |
          $out = "build/windows/x64/runner/Release"
          Compress-Archive -Path "$out/*" -DestinationPath "Meridian-windows-x64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: Meridian-windows-x64
          path: client/Meridian-windows-x64.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: client/Meridian-windows-x64.zip
